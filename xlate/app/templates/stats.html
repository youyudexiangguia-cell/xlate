<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="require-trusted-types-for 'script'">
<title>{{title}}</title>
<style>
  :root { --bd:#d1d5db; --mut:#6b7280; --blue:#1d4ed8; --bg:#f9fafb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
         font-size:14px; color:#111827; background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--bd); padding:10px 18px;
           display:flex; align-items:center; gap:18px; position:sticky; top:0; z-index:5; }
  header .brand { font-weight:700; font-size:15px; }
  header nav a { color:var(--mut); text-decoration:none; margin-right:14px; }
  header nav a.on { color:var(--blue); font-weight:600; }
  main { max-width:900px; margin:22px auto; padding:0 18px; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:8px; padding:16px;
          margin-bottom:16px; }
  h1 { font-size:19px; margin:0 0 12px; }
  h2 { font-size:15px; margin:0 0 10px; color:#374151; }
  .mut { color:var(--mut); font-size:12px; }
  .kpis { display:flex; gap:26px; flex-wrap:wrap; }
  .kpi .n { font-size:26px; font-weight:700; color:var(--blue); }
  .kpi .l { color:var(--mut); font-size:12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #f3f4f6; }
  th { color:var(--mut); font-size:12px; font-weight:600; }
  .bar { height:9px; background:#e0e7ff; border-radius:5px; display:inline-block;
         vertical-align:middle; }
  .msg { color:var(--mut); padding:10px 0; }
  .warn { color:#92400e; background:#fffbeb; border:1px solid #fde68a;
          border-radius:6px; padding:9px 11px; }
</style>
</head>
<body>
<header>
  <span class="brand">xlate</span>
  <nav>
    <a href="/" id="nav-lookup">查词</a>
    <a href="/glossary" id="nav-glossary">词库</a>
    <a href="/stats" id="nav-stats">统计</a>
    <a href="/docs" target="_blank" rel="noopener">API</a>
  </nav>
</header>
<main>
  <div class="card">
    <h1>统计</h1>
    <div class="kpis" id="kpis"></div>
    <div class="mut" id="src" style="margin-top:12px"></div>
  </div>
  <div class="card">
    <h2>领域分布</h2>
    <table>
      <thead><tr><th style="width:20%">领域</th><th style="width:14%">义项</th><th>占比</th></tr></thead>
      <tbody id="fields"></tbody>
    </table>
  </div>
  <div class="card" id="unknown-card" style="display:none">
    <h2>未归入规范表的领域</h2>
    <div class="warn" id="unknown"></div>
  </div>
</main>

<script>
'use strict';
/* 零 innerHTML（README §7.1） */
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = String(text);
  return n;
}
function setNav() { const a = $('nav-{{nav}}'); if (a) a.className = 'on'; }

function kpi(label, value) {
  const box = el('div', 'kpi');
  box.appendChild(el('div', 'n', value));
  box.appendChild(el('div', 'l', label));
  return box;
}

async function load() {
  try {
    const r = await fetch('/api/stats');
    const d = await r.json();
    if (!r.ok) { $('kpis').appendChild(el('div', 'msg', 'HTTP ' + r.status)); return; }

    const k = $('kpis');
    k.replaceChildren();
    k.appendChild(kpi('词条', d.counts.terms));
    k.appendChild(kpi('义项', d.counts.senses));
    k.appendChild(kpi('一词多义', d.counts.polysemous));
    k.appendChild(kpi('领域数', d.fields.length));

    const parts = Object.keys(d.src_distribution)
      .map((s) => s + ': ' + d.src_distribution[s]);
    $('src').textContent = '来源分布　' + parts.join('　·　');

    const max = d.fields.length ? d.fields[0].senses : 1;
    const tb = $('fields');
    tb.replaceChildren();
    for (const f of d.fields) {
      const tr = el('tr');
      tr.appendChild(el('td', null, f.field));
      tr.appendChild(el('td', null, f.senses));
      const td = el('td');
      const bar = el('span', 'bar');
      bar.style.width = Math.max(2, Math.round((f.senses / max) * 240)) + 'px';
      td.appendChild(bar);
      tr.appendChild(td);
      tb.appendChild(tr);
    }

    if (d.unknown_fields && d.unknown_fields.length) {
      $('unknown-card').style.display = '';
      $('unknown').textContent =
        '这些 field 取值没进规范表（导入既有数据时会原样保留）：' +
        d.unknown_fields.join('、');
    }
  } catch (err) {
    $('kpis').appendChild(el('div', 'msg', '请求失败：' + err.message));
  }
}

setNav();
load();
</script>
</body>
</html>
